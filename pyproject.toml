[tool.poetry]
name = "nba-tracking-data-commons"
version = "0.1.6"
description = "Repository housing common functionality for NBA SportVU tracking data"
authors = ["Jackson Lewis"]
readme = "README.md"
packages = [{include = "nba_tracking_data_commons"}]

[tool.pytest.ini_options]
testspath = ["tests"]
addopts = "-p no:cacheprovider"

[tool.poetry.dependencies]
python = "^3.10"
pytorch-lightning = "~2.4.0"
torch = "~2.4.0"
pytorch_model_commons = { git = "https://github.com/jacksonlewis87/pytorch-model-commons.git", tag = "v0.1.9" }

matplotlib = "^3.9.0"
[tool.poetry.group.dev.dependencies]
pytest = "~7.3.0"
pre-commit = "^3.7.1"
black = "^24.4.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
